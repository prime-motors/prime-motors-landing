<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prime Motors — Expert care for hybrid, electric & modern vehicles in Chișinău, Moldova"
    />
    <link rel="preload" as="image" type="image/webp" href="/images/hero-bg.webp" />
    <title>Prime Motors — Auto Repair & Diagnostics</title>

    <!-- SPA redirect handler for GitHub Pages (spa-github-pages) -->
    <script>
      ;(function () {
        var redirect = sessionStorage.redirect
        delete sessionStorage.redirect
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect)
        }
      })()
    </script>

    <!-- Google Tag Manager (loaded only if GTM ID is set at build time) -->
    <script>
      ;(function () {
        var gtmId = '%VITE_GTM_ID%'
        if (!gtmId || gtmId === '' || gtmId.indexOf('VITE_') === 0) return
        var s = document.createElement('script')
        s.innerHTML =
          "(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','" +
          gtmId +
          "');"
        document.head.appendChild(s)
      })()
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe src="" id="gtm-noscript" style="display: none; visibility: hidden" height="0" width="0"></iframe>
    </noscript>
    <script>
      ;(function () {
        var gtmId = '%VITE_GTM_ID%'
        if (!gtmId || gtmId === '' || gtmId.indexOf('VITE_') === 0) return
        document.getElementById('gtm-noscript').src = 'https://www.googletagmanager.com/ns.html?id=' + gtmId
      })()
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
