<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#1a1a1e"/>

  <!-- Tire sidewall (depth visible on left/bottom) -->
  <ellipse cx="46" cy="52" rx="44" ry="44" fill="#222226"/>
  <!-- Tire face -->
  <ellipse cx="50" cy="50" rx="44" ry="44" fill="#2a2a2e"/>
  <!-- Tire tread edge -->
  <ellipse cx="50" cy="50" rx="44" ry="44" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Rim outer lip -->
  <ellipse cx="50" cy="50" rx="36" ry="36" fill="#c49430"/>
  <!-- Rim face -->
  <ellipse cx="50" cy="50" rx="34" ry="34" fill="#d4a24e"/>

  <!-- 5 spoke windows (dark cutouts between spokes) -->
  <g fill="#1a1a1e">
    <!-- Window 1 (top) -->
    <path d="M44 20 Q38 24 34 30 L42 38 Q44 34 48 30 Z"/>
    <!-- Window 2 (upper-right) -->
    <path d="M66 26 Q72 34 74 42 L64 44 Q63 38 59 33 Z"/>
    <!-- Window 3 (lower-right) -->
    <path d="M76 56 Q74 66 68 72 L60 64 Q64 60 65 54 Z"/>
    <!-- Window 4 (bottom) -->
    <path d="M56 80 Q48 82 40 78 L44 68 Q48 70 54 70 Z"/>
    <!-- Window 5 (left) -->
    <path d="M24 66 Q20 58 20 48 L30 46 Q30 54 32 60 Z"/>
  </g>

  <!-- Spoke highlights (gold-bright edges) -->
  <g fill="#e8be60" opacity="0.5">
    <path d="M50 18 L52 18 L50 36 L48 36 Z"/>
    <path d="M68 24 L70 25 L62 40 L60 39 Z"/>
    <path d="M78 50 L78 52 L66 52 L66 50 Z"/>
    <path d="M66 76 L64 78 L58 66 L60 64 Z"/>
    <path d="M34 78 L32 76 L38 66 L40 68 Z"/>
    <path d="M20 50 L20 48 L32 48 L32 50 Z"/>
    <path d="M28 26 L30 24 L38 36 L36 38 Z"/>
  </g>

  <!-- Rim inner channel -->
  <ellipse cx="50" cy="50" rx="14" ry="14" fill="#c49430"/>

  <!-- Hub cap -->
  <circle cx="50" cy="50" r="12" fill="#d4a24e"/>
  <circle cx="50" cy="50" r="10" fill="#e0b060"/>
  <circle cx="50" cy="50" r="8" fill="#d4a24e"/>

  <!-- Lug nuts (5-bolt pattern) -->
  <g fill="#1a1a1e">
    <circle cx="50" cy="42" r="2"/>
    <circle cx="57.6" cy="46.9" r="2"/>
    <circle cx="54.7" cy="55" r="2"/>
    <circle cx="45.3" cy="55" r="2"/>
    <circle cx="42.4" cy="46.9" r="2"/>
  </g>

  <!-- Center bore -->
  <circle cx="50" cy="50" r="3" fill="#1a1a1e"/>

  <!-- Subtle highlight for 3D depth -->
  <ellipse cx="46" cy="38" rx="16" ry="8" fill="white" opacity="0.06"/>

  <!-- Tire sidewall depth effect (crescent on lower-left) -->
  <path d="M10 60 Q6 50 8 38 Q12 28 20 20 Q14 30 12 42 Q10 52 14 62 Z" fill="#222226" opacity="0.6"/>
</svg>
