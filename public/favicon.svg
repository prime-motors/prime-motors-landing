<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#1a1a1e"/>
  <!-- Tire outer edge -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#333" stroke-width="2"/>
  <!-- Tire ring -->
  <circle cx="50" cy="50" r="42" fill="#2a2a2e"/>
  <!-- Rim outer ring -->
  <circle cx="50" cy="50" r="36" fill="#d4a24e"/>
  <!-- Rim inner ring (channel) -->
  <circle cx="50" cy="50" r="34" fill="#c4922e"/>
  <!-- Rim face -->
  <circle cx="50" cy="50" r="32" fill="#d4a24e"/>
  <!-- Spoke windows (5 cutouts between spokes) -->
  <g fill="#1a1a1e">
    <!-- Window 1 (top-right) -->
    <path d="M54 20 Q64 22 70 30 L60 38 Q56 33 54 28 Z"/>
    <!-- Window 2 (right) -->
    <path d="M72 34 Q76 44 74 54 L64 50 Q65 44 63 39 Z"/>
    <!-- Window 3 (bottom-right) -->
    <path d="M72 58 Q68 68 60 74 L56 64 Q60 60 62 55 Z"/>
    <!-- Window 4 (bottom-left) -->
    <path d="M38 74 Q28 68 24 58 L34 54 Q36 60 40 64 Z"/>
    <!-- Window 5 (left) -->
    <path d="M24 52 Q22 42 28 32 L36 38 Q33 44 34 50 Z"/>
    <!-- Window 6 (top-left) -->
    <path d="M32 28 Q38 22 48 20 L48 30 Q43 31 39 35 Z"/>
  </g>
  <!-- Spoke highlights -->
  <g fill="#e0b060" opacity="0.4">
    <path d="M50 18 L52 19 L51 30 L49 30 Z"/>
    <path d="M71 31 L72 33 L62 40 L61 38 Z"/>
    <path d="M75 56 L74 58 L64 52 L65 50 Z"/>
    <path d="M58 75 L56 76 L54 65 L56 64 Z"/>
    <path d="M30 72 L28 70 L37 62 L38 64 Z"/>
    <path d="M23 44 L24 42 L34 48 L33 50 Z"/>
  </g>
  <!-- Hub cap outer -->
  <circle cx="50" cy="50" r="12" fill="#d4a24e"/>
  <!-- Hub cap highlight ring -->
  <circle cx="50" cy="50" r="10" fill="#e0b060"/>
  <!-- Hub cap inner -->
  <circle cx="50" cy="50" r="8" fill="#d4a24e"/>
  <!-- Hub center bolt -->
  <circle cx="50" cy="50" r="3" fill="#1a1a1e"/>
  <!-- Subtle top highlight for depth -->
  <ellipse cx="50" cy="34" rx="18" ry="6" fill="white" opacity="0.06"/>
</svg>
